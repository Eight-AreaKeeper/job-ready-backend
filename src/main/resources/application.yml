server:
  port: ${PORT:8000}

spring:
  application:
    name: job-ready-backend
  # Default database: in-memory H2 in MySQL mode, zero setup, wiped on restart.
  # Tables come from schema-h2.sql (same tables as db/schema.sql, JSON columns stored as text).
  # Use the "mysql" profile for the real database (see application-mysql.yml and db/schema.sql).
  datasource:
    url: jdbc:h2:mem:jobready;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jobready.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

logging:
  level:
    com.jobready.mapper: info   # set to debug to print SQL

app:
  auth:
    # jwt  = every protected endpoint needs "Authorization: Bearer <token>"
    # demo = requests without a token act as the demo user (front-end convenience)
    mode: ${AUTH_MODE:jwt}
    demo-user-email: demo@jobready.dev
  jwt:
    # Override in any shared/deployed environment: JWT_SECRET must be >= 32 characters.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai:
    # stub = offline rule-based responses. Real provider TBD.
    provider: ${AI_PROVIDER:stub}
  mentors:
    points-per-completed-chat: 10
